name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Weekly dependency vulnerability scan (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (production + full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production security audit
        run: npm run audit:deps -- --audit-level=high

      - name: Full dependency vulnerability scan
        run: npm run audit:all

      - name: Admin export parity
        run: npm run verify:admin-parity

      - name: Admin export dependency audit
        working-directory: deploy/lectrax-admin
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm audit --omit=dev --audit-level=high
            npm audit --audit-level=high
          else
            echo "No admin lockfile; regenerating via npm install for audit"
            npm install --package-lock-only --ignore-scripts
            npm audit --omit=dev --audit-level=high
            npm audit --audit-level=high
          fi
